name: Deploy AW1000 Control Landing Page to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "aw1000-web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload aw1000-web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "aw1000-web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
